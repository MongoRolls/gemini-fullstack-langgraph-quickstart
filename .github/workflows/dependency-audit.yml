name: Dependency audit
'on':
  pull_request: null
  push:
    branches:
    - main
  schedule:
  - cron: 17 6 * * 1
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  audit-1:
    name: Audit frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    env:
      COREPACK_ENABLE_PROJECT_SPEC: '0'
      npm_config_manage_package_manager_versions: 'false'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Audit dependency metadata (no lifecycle scripts)
      run: npm audit --audit-level=low --ignore-scripts --registry=https://registry.npmjs.org
  audit-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install pip-audit==2.10.1
    - name: Audit Python dependencies without installing project code
      run: 'python - <<''PY''

        import pathlib,tomllib

        p=tomllib.loads(pathlib.Path(''pyproject.toml'').read_text())[''project''][''dependencies'']

        pathlib.Path(''/tmp/audit-direct.txt'').write_text(''\n''.join(p))

        PY

        python -m pip install --dry-run --ignore-installed --only-binary=:all: --report
        /tmp/audit-resolved.json -r /tmp/audit-direct.txt

        python - <<''PY''

        import json,pathlib

        p=json.loads(pathlib.Path(''/tmp/audit-resolved.json'').read_text())[''install'']

        pathlib.Path(''/tmp/audit-requirements.txt'').write_text(''''.join(x[''metadata''][''name'']+''==''+x[''metadata''][''version'']+''\n''
        for x in p))

        PY

        python -m pip_audit --disable-pip --no-deps -r /tmp/audit-requirements.txt'
